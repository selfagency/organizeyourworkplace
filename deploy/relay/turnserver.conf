# TURN relay for the workspace app (05-security §Servers).
#
# The relay exists so members never learn each other's IP addresses. It
# carries scrambled traffic: it can see the size and the timing, never the
# contents.
#
# Secrets and certificate paths come from the environment at start time; see
# deploy/env-templates.md §turn.

listening-port=3478
tls-port=5349
fingerprint

# Long-term credentials live in the secret store, not in this file.
lt-cred-mech
use-auth-secret
static-auth-secret=TODO(owner)

realm=sig.organizeyourworkplace.com
server-name=turn.organizeyourworkplace.com

# No CLI, no UDP multicast, no relay of arbitrary addresses.
no-cli
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# TLS 1.2 and up only.
no-tlsv1
no-tlsv1_1
min-tls-version=1.2

# The relay keeps no record of who talked to whom.
no-stdout-log
no-log
no-tcp-relay

# Port range for the relayed connections. Open it in the firewall, and only
# it, next to 3478 and 5349.
min-port=49160
max-port=49200
