# The same rules as Traefik dynamic config (Coolify's default proxy).
# Attach via Coolify's proxy configuration or a file provider.
# H3: access logs are configured off at the Traefik entrypoint level —
# verify with the H3 grep test after any proxy change.

http:
  middlewares:
    security-headers:
      headers:
        # H4 / 05-security.md §Web hardening
        contentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        referrerPolicy: "no-referrer"
        contentTypeNosniff: true
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          Server: ""
    strip-ip:
      headers:
        customRequestHeaders:
          X-Forwarded-For: "0.0.0.0"
          X-Real-IP: "0.0.0.0"
    app-worker:
      headers:
        customResponseHeaders:
          # The service worker for the workspace app has to be allowed to
          # cover /app/ and /es/app/, which are not its own directory.
          Service-Worker-Allowed: "/"
    glitchtip-tunnel:
      headers:
        customRequestHeaders:
          X-Forwarded-For: "0.0.0.0"
          X-Real-IP: "0.0.0.0"
          User-Agent: "oyw-tunnel"
          Cookie: ""
          Referer: ""

  routers:
    site:
      rule: "Host(`organizeyourworkplace.com`)"
      service: site
      middlewares: [security-headers]
    app-worker-path:
      rule: "Host(`organizeyourworkplace.com`) && Path(`/app-sw.js`)"
      service: site
      middlewares: [security-headers, app-worker]
    umami-path:
      rule: "Host(`organizeyourworkplace.com`) && PathPrefix(`/s/`)"
      service: umami
      middlewares: [security-headers, strip-ip]
    glitchtip-tunnel-path:
      rule: "Host(`organizeyourworkplace.com`) && PathPrefix(`/e/`)"
      service: glitchtip
      middlewares: [security-headers, glitchtip-tunnel]
    mbx:
      rule: "Host(`mbx.organizeyourworkplace.com`)"
      service: mbx
      middlewares: [strip-ip]
    mbx-block-admin:
      rule: "Host(`mbx.organizeyourworkplace.com`) && PathPrefix(`/_`)"
      service: mbx-blocked
    sig:
      rule: "Host(`sig.organizeyourworkplace.com`)"
      service: sig
      middlewares: [strip-ip]
    sync:
      rule: "Host(`sync.organizeyourworkplace.com`)"
      service: sync
      middlewares: [security-headers]
      # The sync server rate limits per address, so the real address has to
      # reach it. The sync service is the only one that needs it.

  services:
    site:
      loadBalancer:
        servers:
          - url: "http://site:8080"
    umami:
      loadBalancer:
        servers:
          - url: "http://umami:3000"
    glitchtip:
      loadBalancer:
        servers:
          - url: "http://glitchtip:8000"
    mbx:
      loadBalancer:
        servers:
          - url: "http://mbx_guard:8080"
    sig:
      loadBalancer:
        servers:
          - url: "http://sig:8090"
    sync:
      loadBalancer:
        servers:
          - url: "http://sync:8080"
    mbx-blocked:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1"